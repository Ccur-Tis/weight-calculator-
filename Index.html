<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>體重軌跡與達標日沙盒</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card: #161920;
      --border: #262b36;
      --text: #f3f4f6;
      --muted: #8b949e;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", sans-serif;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle { font-size: 12px; color: var(--muted); }

    /* Hero 達標看板 */
    .hero-card {
      background: linear-gradient(145deg, #191d26, #12151b);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hero-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .date-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .date-value { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
    .days-badge {
      background: var(--accent-glow);
      color: #34d399;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 700;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .metric-item { text-align: center; }
    .metric-lbl { font-size: 11px; color: var(--muted); }
    .metric-val { font-size: 14px; font-weight: 700; margin-top: 2px; }

    /* 圖表區 */
    .chart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
      position: relative;
    }
    canvas { width: 100%; height: 200px; display: block; }
    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .dot-real { width: 10px; height: 3px; background: var(--accent); border-radius: 2px; }
    .dot-linear { width: 10px; height: 2px; background: #6b7280; border-bottom: 1px dashed #9ca3af; }

    /* 滑桿控制區 */
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .slider-group { display: flex; flex-direction: column; gap: 6px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
    .slider-val { color: var(--accent); font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #262b36;
      border-radius: 99px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .quick-chips {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .chip {
      flex: 1;
      background: #20242d;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 5px 0;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">體重軌跡沙盒</div>
    <div class="subtitle">真實代謝適應模型</div>
  </div>

  <div class="hero-card">
    <div class="hero-main">
      <div>
        <div class="date-label">預計達成目標日期</div>
        <div class="date-value" id="targetDateText">計算中...</div>
      </div>
      <div class="days-badge" id="daysLeftBadge">-- 天</div>
    </div>
    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-lbl">初期日赤字</div>
        <div class="metric-val" id="deficitText">-- kcal</div>
      </div>
      <div class="metric-item">
        <div class="metric-lbl">聚餐延遲效應</div>
        <div class="metric-val" id="cheatDelayText" style="color: var(--warn);">+0 天</div>
      </div>
      <div class="metric-item">
        <div class="metric-lbl">達標時代謝下降</div>
        <div class="metric-val" id="adaptDropText">-- kcal</div>
      </div>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="curveCanvas"></canvas>
    <div class="legend">
      <span><i class="dot-real"></i>真實代謝曲線 (含停滯效應)</span>
      <span><i class="dot-linear"></i>傳統理想直線 (7700kcal/kg)</span>
    </div>
  </div>

  <div class="controls">
    <div class="slider-group">
      <div class="slider-header">
        <span>目前體重 ➔ 目標體重</span>
        <span class="slider-val"><span id="wStartVal">75</span> kg ➔ <span id="wGoalVal">65</span> kg</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <input type="range" id="wStart" min="45" max="130" step="0.5" value="75">
        <input type="range" id="wGoal" min="40" max="110" step="0.5" value="65">
      </div>
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>目前每日總消耗 (TDEE)</span>
        <span class="slider-val"><span id="tdeeVal">2200</span> kcal</span>
      </div>
      <input type="range" id="tdee" min="1300" max="3500" step="50" value="2200">
      <div class="quick-chips">
        <div class="chip" onclick="setTDEE(1750, this)">久坐少動 (1750)</div>
        <div class="chip active" onclick="setTDEE(2200, this)">通勤/輕運動 (2200)</div>
        <div class="chip" onclick="setTDEE(2650, this)">規律重訓 (2650)</div>
      </div>
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>平日每日攝取熱量</span>
        <span class="slider-val"><span id="intakeVal">1650</span> kcal</span>
      </div>
      <input type="range" id="intake" min="1000" max="3000" step="50" value="1650">
    </div>

    <div class="slider-group">
      <div class="slider-header">
        <span>每週聚餐/手搖飲額外放縱</span>
        <span class="slider-val" style="color: var(--warn);">+<span id="cheatVal">1000</span> kcal / 週</span>
      </div>
      <input type="range" id="cheat" min="0" max="4000" step="100" value="1000">
    </div>
  </div>

  <script>
    const els = {
      wStart: document.getElementById('wStart'),
      wGoal: document.getElementById('wGoal'),
      tdee: document.getElementById('tdee'),
      intake: document.getElementById('intake'),
      cheat: document.getElementById('cheat'),
      wStartVal: document.getElementById('wStartVal'),
      wGoalVal: document.getElementById('wGoalVal'),
      tdeeVal: document.getElementById('tdeeVal'),
      intakeVal: document.getElementById('intakeVal'),
      cheatVal: document.getElementById('cheatVal'),
      targetDateText: document.getElementById('targetDateText'),
      daysLeftBadge: document.getElementById('daysLeftBadge'),
      deficitText: document.getElementById('deficitText'),
      cheatDelayText: document.getElementById('cheatDelayText'),
      adaptDropText: document.getElementById('adaptDropText'),
      canvas: document.getElementById('curveCanvas')
    };

    function setTDEE(val, btn) {
      els.tdee.value = val;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      updateSimulation();
    }

    function simulateDays(w0, wGoal, tdee0, dailyIntake, weeklyCheat, useAdaptation) {
      let w = w0;
      let days = 0;
      const maxDays = 730;
      const history = [w0];
      const avgDailyIntake = dailyIntake + (weeklyCheat / 7);

      while (w > wGoal && days < maxDays) {
        // 每減去 1kg 體重，身體基礎與活動消耗約下降 22 kcal (代謝適應)
        const currentTDEE = useAdaptation ? (tdee0 - (w0 - w) * 22) : tdee0;
        const dailyDeficit = currentTDEE - avgDailyIntake;
        if (dailyDeficit <= 15) {
          days = Infinity;
          break;
        }
        w -= dailyDeficit / 7700;
        days++;
        history.push(Math.max(w, wGoal));
      }
      return { days, history };
    }

    function updateSimulation() {
      let w0 = parseFloat(els.wStart.value);
      let wGoal = parseFloat(els.wGoal.value);
      if (wGoal >= w0) {
        wGoal = Math.max(40, w0 - 1);
        els.wGoal.value = wGoal;
      }
      const tdee0 = parseFloat(els.tdee.value);
      const intake = parseFloat(els.intake.value);
      const cheat = parseFloat(els.cheat.value);

      els.wStartVal.textContent = w0;
      els.wGoalVal.textContent = wGoal;
      els.tdeeVal.textContent = tdee0;
      els.intakeVal.textContent = intake;
      els.cheatVal.textContent = cheat;

      // 計算真實曲線 vs 無聚餐曲線 vs 傳統直線
      const realSim = simulateDays(w0, wGoal, tdee0, intake, cheat, true);
      const noCheatSim = simulateDays(w0, wGoal, tdee0, intake, 0, true);
      const linearSim = simulateDays(w0, wGoal, tdee0, intake, cheat, false);

      const avgDeficit = Math.round(tdee0 - (intake + cheat / 7));
      els.deficitText.textContent = (avgDeficit > 0 ? "-" : "+") + Math.abs(avgDeficit) + " kcal";
      els.adaptDropText.textContent = "-" + Math.round((w0 - wGoal) * 22) + " kcal";

      if (realSim.days === Infinity || realSim.days >= 730) {
        els.targetDateText.textContent = "熱量赤字不足";
        els.targetDateText.style.color = "var(--danger)";
        els.daysLeftBadge.textContent = "無法達標";
        els.cheatDelayText.textContent = "--";
      } else {
        els.targetDateText.style.color = "var(--accent)";
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + realSim.days);
        const y = targetDate.getFullYear();
        const m = targetDate.getMonth() + 1;
        const d = targetDate.getDate();
        els.targetDateText.textContent = `${y}年 ${m}月 ${d}日`;
        els.daysLeftBadge.textContent = `${realSim.days} 天`;

        const delayDays = realSim.days - noCheatSim.days;
        els.cheatDelayText.textContent = delayDays > 0 ? `慢 ${delayDays} 天` : "無延遲";
      }

      drawChart(w0, wGoal, realSim.history, linearSim.history);
    }

    function drawChart(w0, wGoal, realData, linearData) {
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const W = rect.width;
      const H = rect.height;
      const pad = { top: 18, right: 16, bottom: 24, left: 38 };
      const plotW = W - pad.left - pad.right;
      const plotH = H - pad.top - pad.bottom;

      ctx.clearRect(0, 0, W, H);

      const maxLen = Math.max(realData.length, linearData.length, 30);
      const minW = Math.floor(wGoal - 1);
      const maxW = Math.ceil(w0 + 1);

      const xPos = (i) => pad.left + (i / (maxLen - 1)) * plotW;
      const yPos = (w) => pad.top + ((maxW - w) / (maxW - minW)) * plotH;

      // 畫背景網格與目標線
      ctx.strokeStyle = "#222731";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 3; i++) {
        const y = pad.top + (i / 3) * plotH;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
        const val = (maxW - (i / 3) * (maxW - minW)).toFixed(0);
        ctx.fillStyle = "#6b7280";
        ctx.font = "10px sans-serif";
        ctx.fillText(val + "kg", 4, y + 3);
      }

      // 目標體重水平綠虛線
      const goalY = yPos(wGoal);
      ctx.strokeStyle = "rgba(16, 185, 129, 0.35)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(pad.left, goalY); ctx.lineTo(W - pad.right, goalY); ctx.stroke();
      ctx.setLineDash([]);

      // 1. 畫傳統理想直線 (虛線)
      if (linearData.length > 1) {
        ctx.strokeStyle = "#6b7280";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        linearData.forEach((w, i) => {
          const x = xPos(i), y = yPos(w);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 2. 畫真實代謝適應曲線 (發光實線)
      if (realData.length > 1) {
        ctx.strokeStyle = "#10b981";
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        realData.forEach((w, i) => {
          const x = xPos(i), y = yPos(w);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
      }

      // X 軸天數標記
      ctx.fillStyle = "#6b7280";
      ctx.font = "10px sans-serif";
      ctx.fillText("今天", pad.left, H - 6);
      ctx.fillText(`+${maxLen - 1}天`, W - pad.right - 32, H - 6);
    }

    ['wStart', 'wGoal', 'tdee', 'intake', 'cheat'].forEach(id => {
      els[id].addEventListener('input', updateSimulation);
    });
    window.addEventListener('resize', updateSimulation);
    updateSimulation();
  </script>
</body>
</html>
